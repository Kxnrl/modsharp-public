name: Deploy Docs

on:
  workflow_dispatch:  

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dotnet Setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install DocFX
        run: dotnet tool install docfx --tool-path .build/docfx --version 2.81.0

      - name: Build documentation
        run: ./.build/docfx/docfx docfx/docfx.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "docfx/_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5